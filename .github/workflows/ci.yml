name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the run still in flight for the same branch or pull
# request: that commit is already superseded, so verifying it is work nobody
# will read. Keyed on the ref rather than the SHA — a second push carries a
# second SHA, so a SHA-keyed group never matches the run it is meant to cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nx 23 keeps its task cache and the database indexing it in ~/.nx/<hash>/,
# outside the checkout. Setting either variable keeps both in the checkout,
# where actions/cache below saves them.
env:
  NX_CACHE_DIRECTORY: .nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: .nx/workspace-data

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 to match the Dockerfile's builder stage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is an npm 11 artifact, and npm 10 (what Node 22 ships)
      # builds a different tree from it — `npm ci` then rejects the lockfile as
      # out of sync. The Dockerfile pins npm 11 for the same reason; keep CI,
      # the image build and local dev on one npm.
      - run: npm install -g npm@11

      - run: npm ci

      # The Prisma client is generated code the api build and its specs import.
      - name: Generate Prisma client
        run: npx prisma generate --schema=./apps/api/prisma/schema.prisma

      # The artifacts and their index travel together; one without the other
      # gets no hits. Every run saves under its own SHA and restores the newest
      # prefix match; Nx re-hashes each task's inputs, so a stale entry is a miss.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nx-verify-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npx nx run-many -t lint build

      # The `ci` configuration (nx.json) is what turns coverage on. A separate
      # step, because `-c ci` would otherwise apply to lint and build as well.
      - run: npx nx run-many -t test -c ci

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same npm pin as the verify job — see the note there.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=./apps/api/prisma/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Same scheme as the verify job; its own key, because it runs other tasks.
      - uses: actions/cache@v4
        with:
          path: |
            .nx/cache
            .nx/workspace-data
          key: nx-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nx-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The suite is hermetic — route interception stands in for the API, so no
      # database or backend is needed here.
      - run: npx nx e2e client-e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7

  stack:
    name: Stack smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The README's path, verbatim: the only thing that proves migrations,
      # the seed, nginx and main.ts work together, and that a clone runs.
      - run: cp .env.example .env

      # Started first: the image build is the slow part, and the host install
      # below overlaps with the backend migrating and seeding.
      - run: docker compose up -d --build

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same npm pin as the verify job — see the note there.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npx nx e2e api-e2e

      # Last, because it stops the backend.
      - name: Graceful shutdown
        run: bash scripts/check-graceful-shutdown.sh

      - name: Stack logs
        if: ${{ failure() }}
        run: docker compose logs
