name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the run still in flight for the same branch or pull
# request: that commit is already superseded, so verifying it is work nobody
# will read. Keyed on the ref rather than the SHA — a second push carries a
# second SHA, so a SHA-keyed group never matches the run it is meant to cancel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node 22 to match the Dockerfile's builder stage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is an npm 11 artifact, and npm 10 (what Node 22 ships)
      # builds a different tree from it — `npm ci` then rejects the lockfile as
      # out of sync. The Dockerfile pins npm 11 for the same reason; keep CI,
      # the image build and local dev on one npm.
      - run: npm install -g npm@11

      - run: npm ci

      # The Prisma client is generated code the api build and its specs import.
      - name: Generate Prisma client
        run: npx prisma generate --schema=./apps/api/prisma/schema.prisma

      - run: npx nx run-many -t lint test build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same npm pin as the verify job — see the note there.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=./apps/api/prisma/schema.prisma

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite is hermetic — route interception stands in for the API, so no
      # database or backend is needed here.
      - run: npx nx e2e client-e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright
          retention-days: 7
