server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Gzip compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # 2. Frontend (the Angular SPA)
    location / {
        try_files $uri $uri/ /index.html;

        # Here rather than on the server: /api/ would inherit server-level
        # headers on top of helmet's. The script policy is the <meta> CSP the
        # client build writes (autoCsp); this header adds frame-ancestors, which
        # a <meta> CSP cannot carry. A browser enforces both.
        add_header Content-Security-Policy "frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 3. Backend (API proxy)
    # A request to http://host/api/cities is proxied to http://backend:3000/cities
    location /api/ {
        # 'backend' is the service name in docker-compose
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # The client's address, for the API's rate limiter. Appended rather than
        # overwritten, and the API trusts exactly one hop (TRUST_PROXY), so what
        # it reads is the address nginx saw, never one the client sent itself.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
